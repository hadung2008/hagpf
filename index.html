<style>
  .printable-area {
    position: absolute;
    left: -9999px;
    top: auto;
    width: 8.5in; /* A standard paper width for layout */

    color: black;
  }
  .printable-area.rendering-pdf {
    position: fixed;
    left: 0;
    top: 0;
    z-index: -1;
    opacity: 0;
    pointer-events: none;
  }
  @media print {
    body * {
      visibility: hidden;
    }
    .printable-area, .printable-area * {
        visibility: visible;
    }
    .printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }
    .print-no-break {
      page-break-inside: avoid;
    }
  }
